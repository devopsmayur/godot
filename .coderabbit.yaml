# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  path_instructions:
    - path: "scene/gui/**"
      instructions: |
        Platform-team standard: every modal prompt/dialog (anything with OK/Cancel semantics)
        MUST derive from AcceptDialog or ConfirmationDialog (scene/gui/dialogs.h).
        Never derive a dialog directly from Window or Popup and re-implement buttons,
        focus, Escape/close handling or hide_on_ok. Point to the canonical pattern in review.
    - path: "editor/**"
      instructions: |
        Same dialog standard as scene/gui: derive from ConfirmationDialog/AcceptDialog.
        Use callable_mp() for signal connections; use TTR()/TTRC() for user-visible strings.
    - path: "core/**"
      instructions: |
        Core is a dependency of everything. Treat any change to a public signature or
        return-value contract as breaking: list the callers in scene/, editor/ and modules/
        that depend on the old behaviour.
    - path: "misc/playrix_demo/**"
      instructions: |
        Player-facing game code. Review against: COPPA (consent and age gate before collecting
        any child data), GDPR/UK GDPR (new PII fields, logs, third-party sharing), UK Age-Appropriate
        Design Code (privacy-protective defaults for children), App Store/Google Play policies
        (loot-box odds disclosure, refund/cancel path), EU consumer law (full price incl. VAT,
        no fake reference prices or fake urgency, real-money equivalent for virtual currency),
        and PCI DSS (never log or persist card number, CVV or expiry).
  pre_merge_checks:
    custom_checks:
      - name: "COPPA: age gate before data collection"
        mode: "error"
        instructions: |
          Fail if the PR adds code that collects, stores or transmits player data (identifiers, email,
          birth date, location) without first checking an age gate or child-account flag, or that
          reads a child-account flag but ignores it. Pass if the PR touches no player data.
      - name: "GDPR: no new PII in logs or sharing"
        mode: "error"
        instructions: |
          Fail if the PR logs personal data (email, device ID, birth date, location, name) or sends it
          to a third party without a consent check. Pass if no personal data is handled.
      - name: "AADC: privacy-protective defaults"
        mode: "warning"
        instructions: |
          Fail if a new settings structure defaults profile visibility, location sharing, partner
          sharing or personalised ads to enabled. Defaults must be off for children's services.
      - name: "Store policy: odds and refund disclosure"
        mode: "warning"
        instructions: |
          Fail if the PR adds randomised paid rewards (loot boxes) without exposing drop odds to the
          player, or adds a purchase flow without a confirmation step and refund/cancellation info.
      - name: "EU consumer law: price clarity"
        mode: "warning"
        instructions: |
          Fail if displayed prices exclude VAT, show an invented "was" price or fake countdown, or
          show virtual-currency cost without the real-money equivalent.
      - name: "PCI DSS: no card data in logs or storage"
        mode: "error"
        instructions: |
          Fail if card number (PAN), CVV/CVC or expiry is logged, stored in a member, or written to
          disk or any persistent store. Pass if card data is only passed to the payment provider.
      - name: "Dialog must extend AcceptDialog"
        mode: "error"
        instructions: |
          Fail if the PR adds or modifies a C++ class in scene/ or editor/ that is a modal
          dialog or prompt (OK/Cancel or confirm/deny semantics) and derives directly from
          Window or Popup instead of AcceptDialog or ConfirmationDialog. Pass otherwise.
      - name: "Public contract change lists callers"
        mode: "warning"
        instructions: |
          If the PR changes the return value, nullability or signal-emission behaviour of a
          public method in core/ or scene/, fail unless the PR description lists affected callers.
  tools:
    ast-grep:
      enabled: true
      rule_dirs:
        - ".coderabbit/ast-grep-rules"
knowledge_base:
  learnings:
    scope: local
    approval_delay: 0
